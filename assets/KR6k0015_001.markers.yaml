  - {type: variant, offset: 6219, length: 47, content: 一、如法羯磨而心不同，默然在＝任【三】【宮】【聖】任【CB】【宋】【元】【明】【宮】【聖】，在【大】任在任之；二、得同意伴亦默然任之；三、若見小罪而默然；四、為作別住而默然；五、在戒場上而默然, 宋: 一如法羯磨而心不同默然在之二得同意伴亦默然任之三若見小罪而默然四為作別住而默然五在戒場上而默然, 元: 一如法羯磨而心不同默然在之二得同意伴亦默然任之三若見小罪而默然四為作別住而默然五在戒場上而默然, 明: 一如法羯磨而心不同默然在之二得同意伴亦默然任之三若見小罪而默然四為作別住而默然五在戒場上而默然, 宮: 一如法羯磨而心不同默然在之二得同意伴亦默然任之三若見小罪而默然四為作別住而默然五在戒場上而默然}
