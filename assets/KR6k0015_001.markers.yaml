  - {type: xml-element, offset: 7420, content: '', id: pT22p1070c1801, name: p, role: open, attrs: {'xml:id': pT22p1070c1801}}
  - {type: variant, offset: 7420, length: 289, content: 按此羯磨一卷，宋本與國本則同，丹本將二本獨異。何耶？今撿丹本，與懷素所集文義大同，又其起盡有倫敘可觀，知是跋摩所譯正本，故取之入藏。彼國、宋二本，甚是錯亂。凡尼出家始終之例，初求出家，次受十戒學法，二歲受具足戒，久後方乞畜眾羯磨度人授戒，乃其序也。二本於受六法請和尚文，重用沙彌請十戒文，此一亂也。以乞畜眾文繫乎受大戒前，二亂也。凡尼受戒，先於尼僧中受，後至大僧而受；二本即云：二部僧聽。不分先後，三亂也。其學戒六法中，《四分》即以非時食與飲酒為第五、六，而二本乃以摩觸八事為五、為六，四亂也。首題既云：尼羯磨。二本即有比丘度沙彌法、沙彌受十戒法、大僧受具戒法等，五亂也。《開元錄》云「宋求那跋摩譯」。二本但云：女人出家法。六亂也。故知二本是乃後代無稽之人臆度亂鈔耳，不可依用，今故遆之, 宋: '', 元: '', 明: ''}
